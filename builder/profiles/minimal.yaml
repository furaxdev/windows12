# Profil "minimal" — Phase 2 : builder minimal, preuve de mécanisme uniquement.
# Aucune fonctionnalité UI listée dans docs/FEATURES.md n'est encore branchée à un profil :
# ce fichier ne fait aujourd'hui qu'activer/désactiver l'étape de preuve de mécanisme (40).
# Les phases suivantes ajouteront ici les vrais flags (start_menu, taskbar, wallpapers, etc.)
# au fur et à mesure qu'ils seront réellement implémentés — pas avant.

name: minimal

features:
  # Écrit un fichier marqueur + une valeur de registre de test dans l'image (preuve de mécanisme).
  trivial_marker: true
  # Remplace le fond d'écran par défaut du bureau (assets/wallpapers/) + configure le profil
  # utilisateur par défaut pour l'utiliser. Voir builder/modules/45-wallpaper.sh.
  wallpaper: true
  # "By FuraxDev" dans winver + informations OEM. Voir builder/modules/42-branding.sh.
  branding: true
  # Thème sombre + accent coloré natif. Voir builder/modules/46-theme.sh.
  theme: true
  # EXPERIMENTAL / UNTESTED — barre des tâches "pilule flottante" via Windhawk.
  # Désactivé par défaut : dépose uniquement de la documentation, n'installe/n'exécute
  # RIEN automatiquement. Voir ui/taskbar/EXPERIMENTAL-floating-pill/README.md avant de
  # l'activer. Ne mets PAS "true" ici sans avoir lu ce README.
  taskbar_floating_pill_experimental: false

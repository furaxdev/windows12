# Profil "light" — identique à "minimal", uniquement la variante de thème change
# (backlog #92 : alternative claire avec la même identité visuelle Furax).

name: light

features:
  trivial_marker: true
  wallpaper: true
  installer_background: true
  autounattend: true
  first_logon: true
  branding: true
  theme: true
  # Seule différence avec minimal.yaml : thème clair au lieu de sombre. Transparence,
  # accent dérivé du fond d'écran et icônes centrées restent identiques dans les deux cas.
  theme_variant: light
  privacy_performance: true
  taskbar_floating_pill_experimental: false
  # EXPERIMENTAL / UNTESTED (rendu visuel) — écran accueil maison avant le vrai Setup
  # (apps/furax-setup-wizard/, C#/.NET, PAS de patch de bootmgr/winload/setup.exe).
  # Désactivé par défaut : compilation+dépôt vérifiés, rendu réel au boot non vérifié.
  # Voir docs/FEATURES.md et builder/modules/44b-setup-wizard.sh avant de l'activer.
  setup_wizard_experimental: false

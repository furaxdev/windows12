# Profil "full" — identique à "minimal" pour l'instant (Phase 2).
#
# ⚠️ Ce fichier NE DOIT PAS lister de fonctionnalités UI tant qu'elles ne sont pas réellement
# implémentées dans le builder (voir la règle absolue du projet : docs/FEATURES.md est la seule
# source de vérité sur l'état réel de chaque fonctionnalité). Il sera étoffé phase après phase.

name: full

features:
  trivial_marker: true
  wallpaper: true
  installer_background: true
  # Dépose autounattend.xml à la racine de l'ISO : accepte l'EULA, saute la
  # sélection d'édition (index 1), compte local "Furax" à l'OOBE (pas de compte
  # Microsoft forcé), saute les écrans Wi-Fi/OEM obligatoires. Voir
  # builder/modules/43-autounattend.sh. Comportement réel au boot UNCONFIRMED
  # (jamais testé sur un vrai Windows Setup dans cet environnement).
  autounattend: true
  # Script exécuté UNE SEULE FOIS au tout premier login (RunOnce natif) : point de
  # restauration système + message de bienvenue. Voir
  # builder/modules/41-first-logon.sh. Exécution réelle au boot UNCONFIRMED.
  first_logon: true
  branding: true
  theme: true
  # Variante du thème : dark (défaut) ou light. Voir backlog #92 / 46-theme.sh.
  theme_variant: dark
  privacy_performance: true
  # EXPERIMENTAL / UNTESTED — voir ui/taskbar/EXPERIMENTAL-floating-pill/README.md.
  # Reste désactivé même dans le profil "full" : ce n'est pas un tweak natif vérifié,
  # c'est une doc pour une manip manuelle post-installation. Ne pas activer sans lire.
  taskbar_floating_pill_experimental: false
